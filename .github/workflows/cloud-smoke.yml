name: Cloud smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guest-render:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:cloud
        env:
          DECKRENDER_E2E: '1'
